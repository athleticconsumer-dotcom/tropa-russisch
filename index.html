.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}

.plan li{margin:8px 0}
.prompt{font:20px/1.4 "PT Serif",serif;margin:6px 0}

@media(max-width:600px){.top .in{flex-direction:column;align-items:flex-start}.timer{width:100%;justify-content:space-between}h2{font-size:26px}.card{padding:18px}}

  for(const k of new Set([...Object.keys(a.gr||{}),...Object.keys(b.gr||{})]))m.gr[k]=Math.max((a.gr||{})[k]||0,(b.gr||{})[k]||0);
  return m};
window.TROPA=Object.assign(window.TROPA||{},{
  get:()=>S,
  merge:cloud=>{S=mergeState(S,cloud||{});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}stats();render();return S}
});
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const dnum=s=>Math.floor(new Date(s+'T12:00:00').getTime()/864e5);
const mark=()=>{S.a[day()]=1;save();stats()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>s.replace(/́/g,'');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);
const IV=[0,1,2,4,8,16];
const spkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const say=t=>{try{const u=new SpeechSynthesisUtterance(plain(t));u.lang='ru-RU';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});

function stats(){
  let st=0,o=S.a[day()]||S.d[day()]?0:-1;
  while(S.a[day(o)]||(S.d[day(o)]||0)>=60){st++;o--}
  $('sStreak').textContent=st;

/* Timer 20 Minuten */

  run=setInterval(()=>{left--;S.d[day()]=(S.d[day()]||0)+1;if(left%15===0){save();stats()}tShow();

/* Tabs */
const TABS=[['heute','Heute'],['karten','Karten'],['texte','Texte'],['grammatik','Grammatik'],['quiz','Quiz'],['sprechen','Sprechen']];

  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));render()};

const chips=(cur,all=true)=>`<div class="chips" id="chips">${(all?[{id:'all',n:'Alle Themen'}]:[]).concat(T).map(t=>`<button class="chip" data-tp="${t.id}" aria-pressed="${t.id===cur}">${t.n}</button>`).join('')}</div>`;
const bindChips=fn=>{$('chips').onclick=e=>{const b=e.target.closest('[data-tp]');if(b)fn(b.dataset.tp)}};

function render(){({heute,karten,texte,grammatik,quiz,sprechen})[tab]();window.scrollTo({top:0})}

/* HEUTE */
function heute(){
  const all=T.flatMap(t=>V[t.id]),now=dnum(day());
  const due=all.filter(w=>S.c[w[0]]&&dnum(S.c[w[0]].dd)<=now).length,nw=all.filter(w=>!S.c[w[0]]).length;
  const nextT=X.find(x=>!S.tx[x.id])||X[0],nextG=G.find(g=>!S.gr[g.id])||G[0];

  <div class="grid2">

  </div>

  <div class="list">${T.map(t=>`<div><div style="display:flex;justify-content:space-between"><span>${t.n} · <span style="font-family:'PT Serif',serif">${t.ru}</span></span><span class="meta">${pct(t)} %</span></div><div class="bar"><i style="width:${pct(t)}%"></i></div></div>`).join('')}</div>
  <div class="grid2" style="margin-top:18px">
   <div class="card"><div class="score">${Object.keys(S.tx).length}/${X.length}</div><div class="meta">Texte gelesen</div></div>
   <div class="card"><div class="score">${Object.keys(S.gr).length}/${G.length}</div><div class="meta">Grammatik-Themen geübt</div></div>

  </div>
  <p class="note">Fortschritt wird nur in diesem Browser gespeichert. Betonungen (´) stehen in den Karten; im echten Russisch schreibt man sie nicht.</p>`;
  $('goT').onclick=()=>{openText(nextT.id)};$('goG').onclick=()=>{openGram(nextG.id)};

/* KARTEN (Leitner-System) */
let deck=[],di=0,flipped=false,dir='ru';
function buildDeck(){
  const now=dnum(day()),w=words(topic);
  const due=shuf(w.filter(x=>S.c[x[0]]&&dnum(S.c[x[0]].dd)<=now));
  const fresh=w.filter(x=>!S.c[x[0]]).slice(0,8);
  deck=due.concat(fresh);di=0;flipped=false;
}
function karten(){
  if(topic==='all'&&!deck.length)topic='islam';
  buildDeck();drawCards();
}
function drawCards(){
  const w=deck[di];
  let body;
  if(!w){const nxt=words(topic).filter(x=>S.c[x[0]]).map(x=>dnum(S.c[x[0]].dd)).sort((a,b)=>a-b)[0];
    body=`<div class="card flash"><div class="word">Готово!</div><p>Für heute ist alles wiederholt.${nxt?' Nächste Karten in '+Math.max(1,nxt-dnum(day()))+' Tag(en).':''}</p><div class="row"><button class="btn alt" id="more">8 neue Wörter</button></div></div>`}
  else{const c=S.c[w[0]],b=c?c.b:0,front=dir==='ru';
    body=`<div class="card flash" id="fc">
     ${front||flipped?`<div class="word">${esc(w[0])} <button class="spk" data-say="${esc(w[0])}" aria-label="Anhören">${spkSvg}</button></div>`:''}
     ${!front||flipped?`<div class="de">${esc(w[1])}</div>`:''}
     ${flipped?`<div class="ex">${esc(w[2])} <button class="spk" data-say="${esc(w[2])}" aria-label="Satz anhören">${spkSvg}</button><i>${esc(w[3])}</i></div>`:'<p class="meta">Erst selbst überlegen, dann umdrehen.</p>'}
     <div class="boxes" aria-label="Stufe ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('')}</div>
    </div>
    <div class="row">${flipped?`<button class="btn" id="no">Nochmal</button><button class="btn alt" id="yes">Wusste ich</button>`:`<button class="btn" id="flip">Umdrehen</button>`}
     <span class="meta" style="align-self:center">${di+1} / ${deck.length}</span></div>`}
  $('view').innerHTML=`<h2>Karten</h2><p class="lead">Gewusste Wörter kommen in immer größeren Abständen wieder (1, 2, 4, 8, 16 Tage).</p>${chips(topic)}
   <div class="chips"><button class="chip" id="dRu" aria-pressed="${dir==='ru'}">Russisch → Deutsch</button><button class="chip" id="dDe" aria-pressed="${dir==='de'}">Deutsch → Russisch</button></div>${body}`;
  bindChips(t=>{topic=t;buildDeck();drawCards()});
  $('dRu').onclick=()=>{dir='ru';flipped=false;drawCards()};$('dDe').onclick=()=>{dir='de';flipped=false;drawCards()};
  if($('flip'))$('flip').onclick=()=>{flipped=true;drawCards();if(dir==='de')say(w[0])};
  if($('yes'))$('yes').onclick=()=>grade(true);
  if($('no'))$('no').onclick=()=>grade(false);
  if($('more'))$('more').onclick=()=>{const f=words(topic).filter(x=>!S.c[x[0]]).slice(0,8);deck=f.length?f:shuf(words(topic)).slice(0,8);di=0;flipped=false;drawCards()};
}
function grade(ok){
  const w=deck[di],c=S.c[w[0]]||{b:0};
  c.b=ok?Math.min(5,c.b+1):1;
  const d=new Date();d.setDate(d.getDate()+(ok?IV[c.b]:0));c.dd=d.toISOString().slice(0,10);
  S.c[w[0]]=c;if(!ok)deck.push(w);
  di++;flipped=false;mark();drawCards();
}

/* TEXTE */
let ttp='all';
function texte(){
  const ls=X.filter(x=>ttp==='all'||x.tp===ttp);
  $('view').innerHTML=`<h2>Texte</h2><p class="lead">Kurze Lesetexte von A2 bis B1. Unterstrichene Wörter antippen für die Bedeutung.</p>${chips(ttp)}
  <div class="list">${ls.map(x=>`<button class="item" data-x="${x.id}"><div><div class="t" style="font-family:'PT Serif',serif;font-size:19px">${esc(x.ti)}</div><div class="s">${esc(x.de)} · ${T.find(t=>t.id===x.tp).n}</div></div><span class="tag ${S.tx[x.id]?'done':''}">${S.tx[x.id]?'gelesen':x.lv}</span></button>`).join('')}</div>`;
  bindChips(t=>{ttp=t;texte()});
  $('view').querySelector('.list').onclick=e=>{const b=e.target.closest('[data-x]');if(b)openText(b.dataset.x)};
}
function openText(id){
  if(tab!=='texte'){history.replaceState(null,'','#texte');tab='texte';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='texte'))}

  $('view').innerHTML=`<button class="btn gh" id="back">← Alle Texte</button>
  <h2 style="margin-top:16px;font-family:'PT Serif',serif">${esc(x.ti)} <button class="spk" data-say="${esc(x.tx.replace(/\{([^|}]+)\|[^}]+\}/g,'$1'))}" aria-label="Text vorlesen">${spkSvg}</button></h2>
  <p class="lead">${esc(x.de)} · ${x.lv}</p>
  <div class="card"><div class="text" id="tx">${html}</div>
  <div class="gloss" id="gl"><span>Tippe ein unterstrichenes Wort an.</span></div></div>
  <h3>Verständnisfragen</h3><div id="qs">${qs}</div><p class="meta" id="res"></p>`;
  $('back').onclick=texte;
  $('tx').onclick=e=>{const b=e.target.closest('.g');if(!b)return;document.querySelectorAll('.g.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    $('gl').innerHTML=`<span><b>${esc(b.dataset.w)}</b> · ${esc(b.dataset.g)}</span><button class="spk" style="border-color:rgba(255,255,255,.5)" data-say="${esc(b.dataset.w)}" aria-label="Anhören">${spkSvg}</button>`};
  let done=0,right=0;
  $('qs').onclick=e=>{const o=e.target.closest('.opt');if(!o)return;const q=o.closest('.q');if(q.dataset.a)return;q.dataset.a=1;done++;
    const r=o.dataset.r==='true';if(r)right++;o.classList.add(r?'ok':'bad');if(!r)q.querySelector('[data-r=true]').classList.add('ok');
    if(done===x.qs.length){S.tx[x.id]=1;mark();$('res').textContent=`${right} von ${x.qs.length} richtig. Text als gelesen markiert.`}};
  window.scrollTo({top:0});
}

/* GRAMMATIK */
function grammatik(){
  $('view').innerHTML=`<h2>Grammatik</h2><p class="lead">Die wichtigsten Schritte von A2 zu B1, mit Sätzen aus deinen drei Themen.</p>
  <div class="list">${G.map(g=>`<button class="item" data-g="${g.id}"><div><div class="t">${esc(g.ti)}</div><div class="s">${g.q.length} Übungen</div></div><span class="tag ${S.gr[g.id]?'done':''}">${S.gr[g.id]?S.gr[g.id]+'/'+g.q.length:g.lv}</span></button>`).join('')}</div>`;
  $('view').querySelector('.list').onclick=e=>{const b=e.target.closest('[data-g]');if(b)openGram(b.dataset.g)};
}
function openGram(id){
  if(tab!=='grammatik'){history.replaceState(null,'','#grammatik');tab='grammatik';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='grammatik'))}
  const g=G.find(x=>x.id===id);
  $('view').innerHTML=`<button class="btn gh" id="back">← Alle Themen</button>
  <h2 style="margin-top:16px">${esc(g.ti)}</h2><p class="lead">Niveau ${g.lv}</p>
  <div class="expl">${g.ex}<ul class="exs">${g.eg.map(e=>`<li>${esc(e[0])}<span>${esc(e[1])}</span></li>`).join('')}</ul></div>
  <h3>Übung</h3><div id="qs">${g.q.map((q,i)=>`<div class="q"><p style="font-family:'PT Serif',serif;font-size:19px">${i+1}. ${esc(q[0])}</p><div class="opts">${shuf(q[1].map((o,j)=>[o,j===0])).map(([o,r])=>`<button class="opt" data-r="${r}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('')}</div><p class="meta" id="res"></p>`;
  $('back').onclick=grammatik;
  let done=0,right=0;
  $('qs').onclick=e=>{const o=e.target.closest('.opt');if(!o)return;const q=o.closest('.q');if(q.dataset.a)return;q.dataset.a=1;done++;
    const r=o.dataset.r==='true';if(r)right++;o.classList.add(r?'ok':'bad');const c=q.querySelector('[data-r=true]');c.classList.add('ok');
    const p=q.querySelector('p');say(p.textContent.replace(/^\d+\.\s*/,'').replace('___',c.dataset.v).replace(/\s*\([^)]*\)/,''));
    if(done===g.q.length){S.gr[g.id]=right;mark();$('res').textContent=`${right} von ${g.q.length} richtig.`}};
  window.scrollTo({top:0});

/* QUIZ */
let qtp='all';
function quiz(){
  const pool=words(qtp),qs=shuf(pool).slice(0,10).map((w,i)=>{
    const ru=i%2===0,wrong=shuf(pool.filter(x=>x!==w)).slice(0,3);
    return{p:ru?w[0]:w[1],a:ru?w[1]:w[0],o:shuf([w].concat(wrong).map(x=>ru?x[1]:x[0])),ru}});
  $('view').innerHTML=`<h2>Quiz</h2><p class="lead">10 Fragen, abwechselnd Russisch → Deutsch und Deutsch → Russisch.</p>${chips(qtp)}
  <div id="qs">${qs.map((q,i)=>`<div class="q" data-i="${i}"><p>${i+1}. <span style="${q.ru?"font-family:'PT Serif',serif;font-size:20px":''}">${esc(q.p)}</span></p><div class="opts">${q.o.map(o=>`<button class="opt" data-v="${esc(o)}" style="${q.ru?'font-family:Rubik,sans-serif':''}">${esc(o)}</button>`).join('')}</div></div>`).join('')}</div>
  <div class="card" id="sc" hidden><div class="score" id="scv"></div><p class="meta">Bestes Ergebnis: <span id="scb"></span>/10</p><button class="btn" id="again">Neues Quiz</button></div>`;
  bindChips(t=>{qtp=t;quiz()});
  let done=0,right=0;
  $('qs').onclick=e=>{const o=e.target.closest('.opt');if(!o)return;const qd=o.closest('.q');if(qd.dataset.a)return;qd.dataset.a=1;done++;
    const q=qs[+qd.dataset.i],r=o.dataset.v===q.a;if(r)right++;o.classList.add(r?'ok':'bad');
    qd.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===q.a)b.classList.add('ok')});
    say(q.ru?q.p:q.a);
    if(done===qs.length){S.qb=Math.max(S.qb,right);mark();$('sc').hidden=false;$('scv').textContent=right+'/10';$('scb').textContent=S.qb;$('sc').scrollIntoView({behavior:'smooth'})}};
  $('again').onclick=quiz;
}

/* SPRECHEN */
let pi=Math.floor(Math.random()*P.length);
function sprechen(){
  const p=P[pi];
  const gpt=`Sprich mit mir auf Russisch, Niveau A2 bis B1. Thema: „${p[0]}“ Stell mir kurze Fragen, eine nach der anderen. Korrigiere meine Fehler erst am Ende in einer kurzen Liste mit der richtigen Form.`;
  $('view').innerHTML=`<h2>Sprechen</h2><p class="lead">Sprich 2 bis 3 Minuten laut zu diesem Thema, oder kopiere den Prompt für deine Sprechübung mit ChatGPT.</p>
  <div class="card flash" style="min-height:240px"><div class="prompt">${esc(p[0])}</div><div class="meta">${esc(p[1])}</div>
   <div class="row" style="justify-content:center"><button class="spk" data-say="${esc(p[0])}" aria-label="Anhören">${spkSvg}</button><button class="btn alt" id="nx">Nächstes Thema</button><button class="btn" id="cp">Prompt kopieren</button></div>
   <p class="meta" id="cpm"></p></div>
  <h3>Hilfreiche Satzanfänge</h3>
  <ul class="exs">${[['Я думаю, что…','Ich denke, dass…'],['Во-первых… во-вторых…','Erstens… zweitens…'],['Мне кажется, что…','Mir scheint, dass…'],['Например,…','Zum Beispiel…'],['Честно говоря,…','Ehrlich gesagt…'],['В общем,…','Alles in allem…']].map(e=>`<li>${e[0]}<span>${e[1]}</span></li>`).join('')}</ul>`;
  $('nx').onclick=()=>{pi=(pi+1)%P.length;sprechen()};
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(gpt);$('cpm').textContent='Kopiert. In ChatGPT einfügen.';mark()}catch(e){$('cpm').textContent=gpt}};
}

tShow();stats();route();
}

  let user=null;
  btn.onclick=async()=>{try{user?await signOut(auth):await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){who.textContent='Anmeldung fehlgeschlagen: '+e.code}};
  window.TROPA.push=async s=>{if(!user)return;try{await setDoc(doc(db,'tropa',user.uid),{state:JSON.stringify(s),updated:Date.now()});who.textContent='Gespeichert in der Cloud · '+(user.displayName||user.email)}catch(e){who.textContent='Cloud-Speichern fehlgeschlagen: '+e.code}};
  onAuthStateChanged(auth,async u=>{
    user=u;
    if(!u){btn.textContent='Mit Google anmelden';who.textContent='Nur auf diesem Gerät gespeichert';return}
    btn.textContent='Abmelden';who.textContent='Synchronisiere …';
    try{const snap=await getDoc(doc(db,'tropa',u.uid));
      const cloud=snap.exists()?JSON.parse(snap.data().state||'{}'):{};
      const merged=window.TROPA.merge(cloud);
      await window.TROPA.push(merged);
    }catch(e){who.textContent='Sync fehlgeschlagen: '+e.code}
  });
}
</script>
</body>
</html>
